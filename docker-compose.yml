services:
  # ============================================
  # Infrastructure
  # ============================================
  mongodb:
    image: mongo:7
    container_name: stockalert-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockalert-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: stockalert-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stockalert-network

  # ============================================
  # Microservices
  # ============================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: stockalert-auth
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockalert-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: stockalert-product
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockalert-network

  stock-service:
    build:
      context: ./stock-service
      dockerfile: Dockerfile
    container_name: stockalert-stock
    ports:
      - "4005:4003"
    environment:
      PORT: 4003
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRODUCT_SERVICE_URL: http://product-service:4002
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - stockalert-network

  alert-service:
    build:
      context: ./alert-service
      dockerfile: Dockerfile
    container_name: stockalert-alert
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockalert-network

# ============================================
# Volumes & Networks
# ============================================
volumes:
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  stockalert-network:
    driver: bridge
